<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBot Funcional - ERMP Villa Clara</title>
    <style>
        :root { 
            --blue: #1A568F; 
            --red: #d32f2f; 
            --bg: #f0f2f5; 
        }
        *, *::before, *::after { 
            box-sizing: border-box; 
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            margin: 0;
        }
        .chat-card { 
            width: 100%; 
            max-width: 480px; 
            height: 680px; 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
        }
        .header { 
            background: var(--blue); 
            color: white; 
            padding: 15px; 
            text-align: center; 
            border-bottom: 4px solid var(--red); 
        }
        .info-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 10px;
            font-size: 11px;
            margin-top: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .info-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        #chat-window { 
            flex: 1; 
            padding: 15px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            background: #e5e5f7; 
        }
        .msg { 
            padding: 10px 15px; 
            border-radius: 15px; 
            font-size: 14px; 
            max-width: 85%; 
            line-height: 1.4;
        }
        .bot { 
            background: white; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px; 
            box-shadow: 2px 2px 5px rgba(0,0,0,0.05); 
            color: #333;
        }
        .user { 
            background: var(--blue); 
            color: white; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px; 
        }
        .input-area { 
            padding: 15px; 
            display: flex; 
            gap: 10px; 
            background: white; 
            border-top: 1px solid #eee;
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #ddd; 
            border-radius: 20px; 
            outline: none; 
            font-size: 14px;
        }
        button.send-btn { 
            background: var(--blue); 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold;
            transition: background 0.2s;
        }
        button.send-btn:hover {
            background: #13406b;
        }
        a {
            color: #1A568F;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="chat-card">

    </div>
    <div id="chat-window">

    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Escriba aquí o pregunte por contacto...">
        <button class="send-btn" onclick="enviar()">Enviar</button>
    </div>
</div>

    function mostrarContacto() {
        agregarMensaje(infoContactoHTML, 'bot');
    }

    function enviar() {
        const input = document.getElementById('userInput');
        const msn = input.value.toLowerCase().trim();
        if(!msn) return;

        agregarMensaje(input.value, 'user');
        input.value = '';

        setTimeout(() => {
            const respuesta = procesarLogica(msn);
            agregarMensaje(respuesta, 'bot');
        }, 500);
    }

    function procesarLogica(msn) {
        // Lógica de detección de palabras clave de contacto primero
        if (msn.includes("contacto") || msn.includes("telefono") || msn.includes("numero") || msn.includes("llamar") || msn.includes("correo") || msn.includes("email") || msn.includes("sitio") || msn.includes("web")) {
            return infoContactoHTML;
        }
        if (msn.includes("direccion") || msn.includes("donde queda") || msn.includes("ubicacion") || msn.includes("lugar") || msn.includes("minas")) {
            return `📍 <b>Ubicación Oficial:</b><br>Calle 6ta No 9 entre Final y Carretera Central Km 295. Las Minas. Santa Clara, Villa Clara.`;
        }
        if (msn.includes("horario") || msn.includes("hora") || msn.includes("abren") || msn.includes("cierran") || msn.includes("que dia")) {
            return `⏰ <b>Horario de atención al cliente:</b><br>Lunes a Viernes de 7:30 AM hasta las 4:00 PM.`;
        }
        if (msn.includes("redes") || msn.includes("facebook") || msn.includes("twitter") || msn.includes("x")) {
            return `📱 <b>Siguenos en las Redes Sociales:</b><br><br>
                • <b>Facebook:</b> <a href="https://www.facebook.com/ermpvc" target="_blank">https://www.facebook.com/ermpvc</a><br>
                • <b>Twitter / X:</b> <a href="https://x.com/ermpvc" target="_blank">https://x.com/ermpvc</a>`;
        }

        let resultados = [];
        for (let clave in db) {
            if (msn.includes(clave)) {
                resultados = db[clave];
                break; 
            }
        }

        if (resultados.length > 0) {
            let respuestaHTML = `📋 <b>Precios oficiales encontrados:</b><br><br>`;
            resultados.forEach(item => {
                respuestaHTML += `• ${item.desc}<br>&nbsp;&nbsp;<b>Precio:</b> ${item.precio.toFixed(2)} CUP / ${item.um}.<br><br>`;
            });
            respuestaHTML += `⚠️ <i>Nota: Los envases deben cumplir las normas de limpieza señaladas.</i>`;
            return respuestaHTML;
        }
        
        if (msn.includes("precio") || msn.includes("lista") || msn.includes("compran")) {
            return "Puedo darte precios de: <b>vidrio</b> (frascos, botellas de ron, cerveza, Parranda, vino), <b>plásticos</b> (PET, bidones, PP), <b>papel, cartón, textiles</b> o <b>chatarras</b> (cobre, aluminio, bronce, acero, plomo, electrónica, celulares). ¿Qué tienes para vender?";
        }
        if (msn.includes("hola") || msn.includes("buenos")) {
            return "¡Hola! ¿Qué materias primas o envases reciclables tienes hoy en Villa Clara? Dime el nombre y te consulto el precio oficial o la información de contacto de la entidad.";
        }
        
        return "No tengo registrado ese material específico. Por favor, intente escribiendo palabras clave como: <i>cobre, aluminio, lata, botella de ron, plastico, carton, o 'contacto'</i> para ver las vías de comunicación.";
    }

    function agregarMensaje(texto, tipo) {
        const win = document.getElementById('chat-window');
        const div = document.createElement('div');
        div.className = `msg ${tipo}`;
        div.innerHTML = texto;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
    }
</script>
